server {
    listen 80;
    # docker-entrypoint's 10-listen-on-ipv6-by-default.sh skips adding IPv6
    # when a custom conf is mounted; without this, `localhost` (-> ::1) and
    # the container healthcheck get "Connection refused".
    listen [::]:80;
    server_name localhost;

    # Use Docker's embedded DNS so upstream hostnames are resolved at request
    # time, not at nginx startup. This keeps the frontend running even when a
    # microservice (backend/shell) is down or restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy: restrict script/style sources to prevent XSS
    # 'unsafe-inline' for style is required by Tailwind's inline style generation.
    # 'self' for script is safe since no external scripts are loaded.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;

    # HSTS (only meaningful over HTTPS, but safe to include)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Deny access to sensitive paths ────────────────────────────────────────
    location ~ /\.(git|env|svn|htaccess) {
        deny all;
        return 404;
    }

    location = /status {
        return 301 /status.html;
    }

    location = /status.html {
        root /usr/share/nginx/html;
        default_type text/html;
        try_files /status.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Resolve at request time so nginx starts even if the backend is down
    set $backend_upstream http://backend:3457;
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;

        # Buffer SSE/long-poll responses
        proxy_buffering off;
        proxy_cache off;
    }

    # Proxy the Podex Shell WebSocket to the shell microservice (same-origin).
    # Resolved per-request: if the shell is down/restarting, nginx stays up and
    # returns 502, and the UI shows its "Shell service unavailable" message.
    set $shell_upstream http://shell:3458;
    location /ws/shell {
        proxy_pass $shell_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    # Static assets with long cache
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 500 502 503 504 /status.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}