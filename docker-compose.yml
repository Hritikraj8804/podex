services:
  shell:
    build:
      context: ./shell
      dockerfile: Dockerfile
    ports:
      - "${SHELL_PORT:-3458}:3458"
    volumes:
      - ~/.kube:/root/.kube-host:ro
    environment:
      - KUBECONFIG=/root/.kube/config
      - KUBE_READONLY_SOURCE=/root/.kube-host
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3458/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-3457}:3457"
    volumes:
      - ~/.kube:/app/.kube:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - KUBECONFIG=/app/.kube/config
      - PORT=3457
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3457/api/stats')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ""
    ports:
      - "${FRONTEND_PORT:-3456}:80"
    depends_on:
      backend:
        condition: service_healthy
    # nginx:alpine-slim runs as the nginx user (non-root) by default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s